name: CI

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDOOST_ENABLE_SIGSEGV_HANDLER=ON

      - name: Build project
        run: cmake --build build --parallel

      - name: Archive build tree
        run: tar -C build -czf build-tree.tar.gz .

      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: doost-build-tree
          path: build-tree.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build archive
        uses: actions/download-artifact@v4
        with:
          name: doost-build-tree
          path: artifact

      - name: Restore build tree
        run: |
          mkdir -p build
          tar -xzf artifact/build-tree.tar.gz -C build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  safe-read:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe read tests
        run: cmake -S . -B build-safe-read -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build safe read tests
        run: cmake --build build-safe-read --target safe_memory_tests --parallel

      - name: Run safe read tests
        run: ctest --test-dir build-safe-read -R '^safe_memory_tests$' --output-on-failure

  benchmark:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build archive
        uses: actions/download-artifact@v4
        with:
          name: doost-build-tree
          path: artifact

      - name: Restore build tree
        run: |
          mkdir -p build
          tar -xzf artifact/build-tree.tar.gz -C build

      - name: Compare task 1 benchmark results
        run: bash benchmark/compare_benchmarks.sh build 100000

      - name: Compare task 2 allocator benchmark results
        run: bash benchmark/compare_allocator_benchmarks.sh build 100000 16

      - name: Run string benchmark
        run: ./build/string_benchmark 1000
